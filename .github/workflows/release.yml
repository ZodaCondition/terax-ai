name: Release Termux

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'ম্যানুয়াল রানের জন্য ভার্সন ট্যাগ লিখুন (যেমন: v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  build-termux:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ট্যাগ নেম সেট করার জন্য ট্রিক
      - name: Set Release Tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "RELEASE_TAG=${{ github.event.inputs.version_tag }}" >> $GITHUB_ENV
          else
            echo "RELEASE_TAG=${{ github.ref_name }}" >> $GITHUB_ENV
          fi

      # Termux GUI বিল্ড প্রসেস (Docker দিয়ে)
      - name: Build for Termux Native X11/XFCE4
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace termux/termux-docker:aarch64 bash -c "
            pkg update -y
            pkg install -y x11-repo
            pkg install -y build-essential nodejs-lts pnpm rust binutils libwebkit2gtk-4.1 libgtk3 librsvg openssl-tool
            pnpm install --frozen-lockfile
            pnpm tauri build
          "

      # তৈরি হওয়া বাইনারি রিলিজ অ্যাসেটে আপলোড করার স্টেপ
      - name: Upload Termux Native Binary to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/terax
            src-tauri/target/release/terax-ai
          draft: true
          tag_name: ${{ env.RELEASE_TAG }}
          name: "Terax Termux ${{ env.RELEASE_TAG }}"
          body: "Termux Native XFCE4/X11 এর জন্য স্পেশাল বিল্ড।"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
