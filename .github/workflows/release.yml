name: Release Termux

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'ম্যানুয়াল রানের জন্য ভার্সন ট্যাগ লিখুন (যেমন: v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  build-termux:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ট্যাগ নেম সেট করার জন্য ট্রিক
      - name: Set Release Tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "RELEASE_TAG=${{ github.event.inputs.version_tag }}" >> $GITHUB_ENV
          else
            echo "RELEASE_TAG=${{ github.ref_name }}" >> $GITHUB_ENV
          fi

      # QEMU এমুলেশন সেটআপ (ARM64 এর জন্য)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      # টার্মাক্স কন্টেইনারের ভেতরে ফোর্সড নন-ইন্টারঅ্যাক্টিভ বিল্ড
      - name: Build for Termux Native X11/XFCE4
        run: |
          docker run --rm --platform linux/arm64 -v ${{ github.workspace }}:/workspace -w /workspace termux/termux-docker:aarch64 bash -c "
            export DEBIAN_FRONTEND=noninteractive
            
            # টার্মাক্স স্ক্রিপ্টের ইন্টারনাল এরর এড়াতে এবং মিরর ফিক্স করতে সরাসরি সোর্স ফাইল রাইট করা
            # এটি মূল রেপো এবং x11 রেপো দুটোকেই সরাসরি ক্লাউডফেয়ার মিরর থেকে ইনজেক্ট করবে (টার্মাক্স হুক স্ক্রিপ্ট বাইপাস হবে)
            mkdir -p /data/data/com.termux/files/usr/etc/apt/sources.list.d
            echo 'deb https://packages-cf.termux.dev/apt/termux-main stable main' > /data/data/com.termux/files/usr/etc/apt/sources.list
            echo 'deb https://packages-cf.termux.dev/apt/termux-x11 x11 main' > /data/data/com.termux/files/usr/etc/apt/sources.list.d/x11.list
            
            # কোনো প্রম্পট বা কনফিগারেশন পপ-আপ ছাড়াই ফোর্স আপডেট
            apt-get update -y -o Dpkg::Options::='--force-confold'
            
            # মূল বিল্ড টুলস এবং এক্স১১ জিইউআই প্যাকেজগুলো একসাথে ইনস্টল (কোনো x11-repo প্যাকেজের ওপর নির্ভর না করে)
            apt-get install -y -o Dpkg::Options::='--force-confold' \
              build-essential \
              nodejs-lts \
              rust \
              binutils \
              libwebkit2gtk-4.1 \
              libgtk3 \
              librsvg \
              openssl-tool
            
            # npm দিয়ে pnpm গ্লোবালি ইনস্টল
            npm install -g pnpm
            
            # ফ্রন্টএন্ড এবং Tauri অ্যাপ কম্পাইল
            pnpm install --frozen-lockfile
            pnpm tauri build
          "

      # তৈরি হওয়া বাইনারি রিলিজ অ্যাসেটে আপলোড করার স্টেপ
      - name: Upload Termux Native Binary to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/terax
            src-tauri/target/release/terax-ai
          draft: true
          tag_name: ${{ env.RELEASE_TAG }}
          name: "Terax Termux ${{ env.RELEASE_TAG }}"
          body: "Termux Native XFCE4/X11 এর জন্য স্পেশাল বিল্ড।"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
