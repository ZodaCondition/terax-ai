name: Release Termux

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'ম্যানুয়াল রানের জন্য ভার্সন ট্যাগ লিখুন (যেমন: v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  build-termux:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ট্যাগ নেম সেট করার জন্য ট্রিক
      - name: Set Release Tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "RELEASE_TAG=${{ github.event.inputs.version_tag }}" >> $GITHUB_ENV
          else
            echo "RELEASE_TAG=${{ github.ref_name }}" >> $GITHUB_ENV
          fi

      # QEMU এমুলেশন সেটআপ (ARM64 এর জন্য)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      # টার্মাক্স কন্টেইনারের ভেতরে ফোর্সড নন-ইন্টারঅ্যাক্টিভ বিল্ড
      - name: Build for Termux Native X11/XFCE4
        run: |
          docker run --rm --platform linux/arm64 -v ${{ github.workspace }}:/workspace -w /workspace termux/termux-docker:aarch64 bash -c "
            # ১. প্রম্পট এড়াতে এবং মিরর ফিক্স করতে এনভায়রনমেন্ট ভ্যারিয়েবল সেটআপ
            export DEBIAN_FRONTEND=noninteractive
            
            # ক্লাউডফেয়ারের স্টেবল অফিশিয়াল মিরর সেটআপ (যাতে মিরর সিলেকশনে টাইম নষ্ট না হয়)
            echo 'deb https://packages-cf.termux.dev/apt/termux-main stable main' > /data/data/com.termux/files/usr/etc/apt/sources.list
            
            # ২. প্রম্পট অটো-এক্সেপ্ট (force-confold) করে প্যাকেজ আপডেট ও ইনস্টল
            apt-get update -y
            apt-get upgrade -y -o Dpkg::Options::='--force-confold'
            
            # ৩. এক্স১১ রেপো এবং মূল বিল্ড টুলস ইনস্টল
            pkg install -y x11-repo
            pkg install -y -o Dpkg::Options::='--force-confold' build-essential nodejs-lts rust binutils libwebkit2gtk-4.1 libgtk3 librsvg openssl-tool
            
            # ৪. pnpm গ্লোবালি ইনস্টল করা (pkg-তে pnpm মাঝে মাঝে ঝামেলা করে)
            npm install -g pnpm
            
            # ৫. ফ্রন্টএন্ড এবং Tauri অ্যাপ কম্পাইল
            pnpm install --frozen-lockfile
            pnpm tauri build
          "

      # তৈরি হওয়া বাইনারি রিলিজ অ্যাসেটে আপলোড করার স্টেপ
      - name: Upload Termux Native Binary to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/terax
            src-tauri/target/release/terax-ai
          draft: true
          tag_name: ${{ env.RELEASE_TAG }}
          name: "Terax Termux ${{ env.RELEASE_TAG }}"
          body: "Termux Native XFCE4/X11 এর জন্য স্পেশাল বিল্ড।"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
